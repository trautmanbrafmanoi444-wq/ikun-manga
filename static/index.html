<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />

  <meta name="theme-color" content="#16191f" media="(prefers-color-scheme: dark)" />

  <title>i kun漫画</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg:#f3f4f7; --card:#fff; --soft:#f0f1f5; --line:#e6e8ee; --txt:#1c1d22; --txt2:#4b505c; --muted:#8c919d;
      --acc:#ff4d5a; --grad:linear-gradient(135deg,#ff8a3d 0%,#ff4d5a 55%,#ff2d87 100%); --acc-soft:#fff0ef;
      --hdr:rgba(255,255,255,.92); --shadow:0 4px 18px rgba(30,35,60,.07); --cover-shadow:0 4px 12px rgba(30,35,60,.14);
      --err:#e5484d; --radius:16px; --gut:16px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:#0e1014; --card:#171a20; --soft:#21252d; --line:#272b34; --txt:#eceef2; --txt2:#b6bbc6; --muted:#7f8592;
        --acc-soft:#3a1d22; --hdr:rgba(22,25,31,.92); --shadow:0 4px 18px rgba(0,0,0,.35); --cover-shadow:0 4px 12px rgba(0,0,0,.45);
      }
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: auto; overflow-x: hidden; overscroll-behavior-x: none; -webkit-text-size-adjust: 100%; }
    html.reading-root { overscroll-behavior: none; }
    body { margin: 0; font: 15px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif; background: var(--bg); color: var(--txt); -webkit-tap-highlight-color: transparent; touch-action: manipulation; overflow-x: clip; }
    a { color: inherit; text-decoration: none; }
    button, input, select { font: inherit; }
    img { -webkit-user-drag: none; }
    :focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
    svg.i { width: 1.15em; height: 1.15em; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    /* header */
    header.top { position: sticky; top: 0; z-index: 30; background: var(--hdr); backdrop-filter: saturate(1.6) blur(14px); -webkit-backdrop-filter: saturate(1.6) blur(14px); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top); }
    .top-inner, .wrap { max-width: 1200px; margin: 0 auto; padding: 0 max(var(--gut), env(safe-area-inset-right)) 0 max(var(--gut), env(safe-area-inset-left)); }
    .top-inner { display: flex; gap: 22px; align-items: center; height: 62px; }
    .brand { display: flex; align-items: center; gap: 9px; font-weight: 900; font-size: 20px; letter-spacing: .02em; flex-shrink: 0; white-space: nowrap; }
    .brand .logo { width: 34px; height: 34px; border-radius: 11px; background: var(--grad); color: #fff; display: grid; place-items: center; font-size: 19px; transform: rotate(-8deg); box-shadow: 0 4px 12px rgba(255,77,90,.35); }
    .brand b { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
    nav { display: flex; gap: 4px; }
    nav a { position: relative; color: var(--txt2); padding: 8px 12px; font-weight: 600; white-space: nowrap; border-radius: 10px; transition: color .15s; }
    nav a:hover { color: var(--acc); }
    nav a.on { color: var(--acc); }
    nav a.on::after { content: ""; position: absolute; left: 50%; bottom: -1px; width: 20px; height: 3px; margin-left: -10px; border-radius: 3px; background: var(--grad); }
    form.search { display: flex; align-items: center; flex: 1; min-width: 0; max-width: 380px; margin-left: auto; background: var(--soft); border: 1px solid transparent; border-radius: 999px; padding: 3px 3px 3px 16px; transition: border-color .15s, background .15s; }
    form.search:focus-within { border-color: var(--acc); background: var(--card); }
    form.search input { flex: 1; min-width: 0; background: none; border: 0; padding: 6px 0; color: inherit; outline: none; }
    form.search .btn { padding: 7px 16px; box-shadow: none; }
    input, select { background: var(--soft); border: 1px solid var(--line); color: inherit; border-radius: 10px; padding: 8px 12px; min-width: 0; }
    input:focus, select:focus { border-color: var(--acc); outline: none; }

    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; background: var(--grad); color: #fff; border: 0; border-radius: 999px; padding: 9px 20px; font-weight: 700; cursor: pointer; white-space: nowrap; box-shadow: 0 4px 14px rgba(255,77,90,.28); transition: filter .15s, transform .15s; }
    .btn:hover { filter: brightness(1.06); }
    .btn:active { transform: scale(.97); }
    .btn:disabled { opacity: .45; cursor: default; filter: none; }
    .btn.ghost { background: var(--soft); color: var(--txt); box-shadow: none; font-weight: 600; }
    .btn.glass { background: rgba(255,255,255,.16); color: #fff; box-shadow: none; border: 1px solid rgba(255,255,255,.28); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
    .btn.sm { padding: 6px 13px; font-size: 13px; }

    /* bottom tab bar (phone) */
    .tabbar { display: none; }

    /* layout */
    .wrap { padding-top: 18px; padding-bottom: 40px; }
    .panel { background: var(--card); border-radius: var(--radius); padding: 18px 20px 20px; margin-top: 18px; box-shadow: var(--shadow); }
    h1 { margin: 0 0 4px; font-size: 24px; line-height: 1.3; font-weight: 800; }
    .sec-head { display: flex; align-items: center; justify-content: space-between; margin: 0 0 14px; gap: 10px; }
    .sec-head h2 { margin: 0; font-size: 19px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
    .sec-head h2::before { content: ""; width: 4px; height: 18px; border-radius: 2px; background: var(--grad); }
    .sec-head .more { color: var(--muted); font-size: 13px; background: var(--soft); padding: 4px 12px; border-radius: 999px; white-space: nowrap; }
    .sec-head .more:hover { color: var(--acc); }
    .sub, .hint, .meta { color: var(--muted); font-size: 13px; }
    .foot { text-align: center; color: var(--muted); font-size: 12px; padding: 36px 16px 10px; }

    /* hero carousel */
    .hero { position: relative; height: 300px; border-radius: 20px; overflow: hidden; background: #1d1f26; box-shadow: var(--shadow); }
    .hero .track { display: flex; height: 100%; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior-x: contain; }
    .hero .track::-webkit-scrollbar { display: none; }
    .slide { position: relative; flex: 0 0 100%; scroll-snap-align: start; scroll-snap-stop: always; display: flex; align-items: center; gap: 32px; padding: 30px 48px; color: #fff; overflow: hidden; }
    .slide .bg { position: absolute; inset: -40px; width: calc(100% + 80px); height: calc(100% + 80px); object-fit: cover; filter: blur(30px) saturate(1.4) brightness(.62); }
    .slide::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(0,0,0,.45), rgba(0,0,0,0) 70%); }
    .slide .cv { position: relative; z-index: 1; width: 176px; aspect-ratio: 3/4; flex-shrink: 0; border-radius: 14px; overflow: hidden; box-shadow: 0 14px 34px rgba(0,0,0,.5); background: #2a2d36; transform: rotate(-2deg); }
    .slide .cv img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .slide .info { position: relative; z-index: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; }
    .slide .tag { background: var(--grad); font-size: 12px; font-weight: 800; padding: 3px 11px; border-radius: 999px; letter-spacing: .04em; }
    .slide h3 { margin: 12px 0 6px; font-size: 34px; line-height: 1.2; font-weight: 900; text-shadow: 0 2px 12px rgba(0,0,0,.35); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .slide .from { color: rgba(255,255,255,.75); font-size: 14px; }
    .slide .go { margin-top: 20px; background: #fff; color: #1c1d22; font-weight: 800; padding: 9px 22px; border-radius: 999px; font-size: 14px; }
    .hero .dots { position: absolute; z-index: 2; right: 22px; bottom: 16px; display: flex; gap: 6px; }
    .hero .dots i { width: 7px; height: 7px; border-radius: 4px; background: rgba(255,255,255,.45); cursor: pointer; transition: width .25s, background .25s; }
    .hero .dots i.on { width: 20px; background: #fff; }

    /* quick entries */
    .quick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: 18px; }
    .quick a { display: flex; align-items: center; gap: 12px; background: var(--card); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); transition: transform .15s; }
    .quick a:hover { transform: translateY(-2px); }
    .quick .ic { width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center; color: #fff; font-size: 20px; flex-shrink: 0; }
    .quick b { display: block; font-size: 15px; }
    .quick small { display: block; color: var(--muted); font-size: 12px; }
    .q1 .ic { background: linear-gradient(135deg,#ff9a3d,#ff4d4d); }
    .q2 .ic { background: linear-gradient(135deg,#ffcf3d,#ff8a00); }
    .q3 .ic { background: linear-gradient(135deg,#6be3ff,#4d7cff); }
    .q4 .ic { background: linear-gradient(135deg,#b28bff,#7a4dff); }

    /* cards */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(142px, 1fr)); gap: 20px 16px; }
    .grid.row { grid-template-columns: none; grid-auto-flow: column; grid-auto-columns: 132px; overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none; padding-bottom: 2px; overscroll-behavior-x: contain; }
    .grid.row::-webkit-scrollbar { display: none; }
    .grid.row .card { scroll-snap-align: start; }
    .card { display: block; min-width: 0; }
    .cover { position: relative; aspect-ratio: 3/4; border-radius: 12px; overflow: hidden; background: linear-gradient(135deg, var(--soft), var(--line)); box-shadow: var(--cover-shadow); }
    .cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .3s, transform .35s; }
    .cover img.ok { opacity: 1; }
    .card:hover .cover img { transform: scale(1.06); }
    .cover .src { position: absolute; top: 6px; right: 6px; font-size: 10px; font-style: normal; font-weight: 700; color: #fff; padding: 1px 6px; border-radius: 5px; background: rgba(0,0,0,.45); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
    .cover .src.hip { background: rgba(122,77,255,.85); }
    .cover .src.bz { background: rgba(255,138,0,.88); }
    .cover .src.kmoe { background: rgba(40,140,220,.9); }
    .cover .no { position: absolute; top: 0; left: 0; min-width: 28px; height: 28px; padding: 0 6px; display: grid; place-items: center; font-style: italic; font-weight: 900; font-size: 15px; color: #fff; background: rgba(0,0,0,.55); border-bottom-right-radius: 12px; }
    .cover .no.n1 { background: linear-gradient(135deg,#ffd34d,#ff9900); }
    .cover .no.n2 { background: linear-gradient(135deg,#c9d3e0,#8794a8); }
    .cover .no.n3 { background: linear-gradient(135deg,#f0a36b,#c56a2e); }
    .cover .badge { position: absolute; left: 0; right: 0; bottom: 0; padding: 22px 8px 6px; font-size: 11px; color: #fff; background: linear-gradient(transparent, rgba(0,0,0,.78)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card .t { margin-top: 8px; font-size: 14px; font-weight: 600; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .card:hover .t { color: var(--acc); }
    .card .s { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* ranking list */
    .rank { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: repeat(5, auto); grid-auto-flow: column; gap: 4px 32px; }
    .rank a { display: grid; grid-template-columns: 34px 54px 1fr; gap: 12px; align-items: center; padding: 8px 6px; border-radius: 12px; transition: background .15s; }
    .rank a:hover { background: var(--soft); }
    .rank .n { font-size: 22px; font-weight: 900; font-style: italic; color: var(--muted); text-align: center; }
    .rank .r1 .n { color: #ff9900; font-size: 28px; }
    .rank .r2 .n { color: #8794a8; font-size: 26px; }
    .rank .r3 .n { color: #c56a2e; font-size: 24px; }
    .rank .c { position: relative; width: 54px; aspect-ratio: 3/4; border-radius: 8px; overflow: hidden; background: var(--soft); box-shadow: var(--cover-shadow); }
    .rank .c img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0; transition: opacity .3s; }
    .rank .c img.ok { opacity: 1; }
    .rank .tx { min-width: 0; }
    .rank .tt { display: block; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .rank .ss { display: block; font-size: 12px; color: var(--muted); }
    .rank a:hover .tt { color: var(--acc); }

    /* list page */
    .list-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
    .seg { display: flex; gap: 4px; background: var(--soft); padding: 4px; border-radius: 999px; }
    .seg a { padding: 6px 14px; border-radius: 999px; font-size: 14px; color: var(--txt2); font-weight: 600; white-space: nowrap; }
    .seg a.on { background: var(--card); color: var(--acc); box-shadow: 0 1px 4px rgba(0,0,0,.1); }
    .list-sub { margin-bottom: 18px; }

    /* skeleton */
    .sk { background: linear-gradient(90deg, var(--soft) 25%, var(--line) 37%, var(--soft) 63%); background-size: 400% 100%; animation: sk 1.3s ease infinite; border-radius: 12px; }
    @keyframes sk { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }
    .sk-card { aspect-ratio: 3/4.5; }
    .sk-line { height: 14px; margin: 8px 0; }
    .hero.sk { box-shadow: none; }

    /* state */
    .state { padding: 48px 16px; text-align: center; color: var(--muted); }
    .state.err { color: var(--err); }
    .state .btn { margin-top: 14px; }

    /* manga detail */
    .m-hero { position: relative; display: flex; gap: 28px; padding: 28px; border-radius: 20px; overflow: hidden; color: #fff; background: #23252d; box-shadow: var(--shadow); }
    .m-hero > .bg { position: absolute; inset: -40px; width: calc(100% + 80px); height: calc(100% + 80px); object-fit: cover; filter: blur(34px) saturate(1.3) brightness(.5); }
    .m-hero > * { position: relative; }
    .m-hero .cover { width: 184px; flex-shrink: 0; align-self: flex-start; box-shadow: 0 12px 30px rgba(0,0,0,.45); }
    .m-hero .body { min-width: 0; flex: 1; display: flex; flex-direction: column; }
    .m-hero h1 { font-size: 30px; font-weight: 900; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 4px; }
    .chips span { background: rgba(255,255,255,.16); border-radius: 999px; padding: 3px 11px; font-size: 12px; color: rgba(255,255,255,.92); }
    .chips span.hot { background: var(--grad); font-weight: 700; }
    .m-hero .desc { color: rgba(255,255,255,.82); font-size: 14px; margin: 12px 0 4px; max-height: 4.5em; overflow: hidden; line-height: 1.5; }
    .m-hero .desc.open { max-height: none; }
    .m-hero .more { align-self: flex-start; color: #ffd0c8; font-size: 13px; cursor: pointer; background: none; border: 0; padding: 0; }
    .bar { display: flex; gap: 10px; flex-wrap: wrap; margin: 12px 0; align-items: center; }
    .m-hero .bar { margin-top: auto; padding-top: 16px; margin-bottom: 0; }
    .m-hero .bar .btn { white-space: normal; text-align: center; }
    .ch-tools { display: flex; gap: 8px; align-items: center; margin: 0 0 14px; flex-wrap: wrap; }
    .ch-tools input { max-width: 260px; flex: 1; }
    .ch-tools .meta { margin-left: auto; }
    .chs { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
    .ch { display: flex; align-items: center; background: var(--soft); border: 1px solid transparent; border-radius: 12px; overflow: hidden; transition: border-color .15s; }
    .ch:hover { border-color: var(--acc); }
    .ch a { flex: 1; min-width: 0; padding: 9px 12px; }
    .ch .name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ch .meta { font-size: 11px; }
    .ch.read .name { color: var(--muted); font-weight: 400; }
    .ch.last { border-color: var(--acc); background: var(--acc-soft); }
    .ch.last .name { color: var(--acc); }
    .ch .dl { background: none; border: 0; color: var(--muted); padding: 0 12px; align-self: stretch; cursor: pointer; font-size: 15px; }
    .ch .dl:hover { color: var(--acc); }

    /* reader: always dark */
    body.reading { --bg:#0c0c0f; --card:#17171c; --soft:#24242b; --line:#2e2e36; --txt:#ececf1; --txt2:#c4c4cc; --muted:#8a8a96; --acc-soft:#3a1d22; background: var(--bg); color: var(--txt); }
    body.reading header.top, body.reading .tabbar, body.reading .foot { display: none; }
    body.reading .wrap { padding: 0; max-width: none; }
    .r-top { position: fixed; top: 0; left: 0; right: 0; z-index: 30; background: rgba(16,16,20,.94); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid #24242b; padding-top: env(safe-area-inset-top); transition: transform .25s ease; }
    body.hide-top .r-top { transform: translateY(-100%); }
    .r-top .in { max-width: 1200px; margin: 0 auto; height: 54px; display: flex; align-items: center; gap: 10px; padding: 0 max(10px, env(safe-area-inset-right)) 0 max(6px, env(safe-area-inset-left)); }
    .r-top .back { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 50%; font-size: 22px; flex-shrink: 0; }
    .r-top .back:hover { background: var(--soft); }
    .r-top .tt { flex: 1; min-width: 0; line-height: 1.3; }
    .r-top .tt b { display: block; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .r-top .tt span { display: block; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .r-top select { max-width: 140px; }
    .r-spacer { height: calc(55px + env(safe-area-inset-top)); }
    .reader { margin: 0 auto; max-width: var(--rw, 860px); touch-action: pan-y; overflow-anchor: auto; }
    .reader .pg { position: relative; background: #141418; display: flex; align-items: center; justify-content: center; color: #4d4d58; font-size: 13px; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    .reader .pg:not(.ok) { aspect-ratio: var(--ar, 0.7); overflow: hidden; }
    .reader .pg.ok { background: none; }
    .reader .pg img { width: 100%; display: block; -webkit-user-drag: none; -webkit-touch-callout: none; user-select: none; }
    .reader .pg:not(.ok) img { position: absolute; top: 0; left: 0; opacity: 0; }
    .reader .pg.fail { flex-direction: column; gap: 10px; color: var(--err); }
    .r-end { max-width: 860px; margin: 28px auto 0; padding: 0 16px 110px; display: grid; gap: 12px; }
    .r-end .btn { padding: 15px; font-size: 16px; }
    .r-end .bar { justify-content: center; margin: 0; }
    .r-end .hint { text-align: center; }
    .progress { position: fixed; top: 0; left: 0; height: 3px; background: var(--grad); z-index: 41; width: 0; transition: width .1s linear; }
    .float-nav { position: fixed; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom)); transform: translateX(-50%); width: min(480px, calc(100% - 20px)); display: flex; gap: 8px; align-items: center; background: rgba(23,23,28,.94); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid #2e2e36; border-radius: 18px; padding: 8px; box-shadow: 0 10px 30px rgba(0,0,0,.6); z-index: 25; transition: opacity .25s, transform .25s; }
    body.hide-top .float-nav { opacity: 0; pointer-events: none; transform: translate(-50%, 24px); }
    .float-nav > .btn { flex-shrink: 0; }
    .float-nav .mid { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 1px; }
    .float-nav select { width: 100%; padding: 4px 8px; font-size: 13px; text-align: center; text-align-last: center; border-radius: 8px; background: var(--soft); }
    .float-nav .cnt { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }

    /* misc */
    .to-top { position: fixed; right: 18px; bottom: calc(18px + env(safe-area-inset-bottom)); width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--card); color: var(--txt); cursor: pointer; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 26; font-size: 18px; box-shadow: 0 4px 16px rgba(0,0,0,.18); }
    .to-top.on { opacity: 1; pointer-events: auto; }
    body.reading .to-top { display: none; }
    .toast { position: fixed; left: 50%; top: calc(76px + env(safe-area-inset-top)); transform: translate(-50%, -10px); background: rgba(28,29,34,.94); color: #fff; padding: 10px 18px; border-radius: 999px; z-index: 50; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; font-size: 14px; max-width: calc(100vw - 32px); }
    .toast.on { opacity: 1; transform: translate(-50%, 0); }
    .pager { display: flex; justify-content: center; gap: 10px; align-items: center; margin-top: 24px; }
    .kbd { display: inline-block; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; font-size: 11px; }

    @media (max-width: 860px) {
      .slide { padding: 24px 28px; gap: 22px; }
      .slide h3 { font-size: 26px; }
      .quick a { padding: 12px; gap: 10px; }
    }
    @media (max-width: 680px) {
      :root { --gut: 12px; --radius: 14px; }
      .top-inner { height: 54px; gap: 12px; }
      .brand { font-size: 17px; gap: 7px; }
      .brand .logo { width: 30px; height: 30px; font-size: 16px; border-radius: 10px; }
      nav { display: none; }
      form.search { max-width: none; padding-left: 14px; }
      form.search .btn { padding: 6px 14px; min-height: 34px; }
      input, select, form.search input { font-size: 16px; }
      .btn { min-height: 42px; padding: 10px 16px; }
      .btn.sm { min-height: 38px; padding: 7px 12px; }

      .tabbar { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--hdr); backdrop-filter: saturate(1.6) blur(14px); -webkit-backdrop-filter: saturate(1.6) blur(14px); border-top: 1px solid var(--line); padding: 0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
      .tabbar a { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 7px 0 5px; font-size: 11px; color: var(--muted); }
      .tabbar a svg.i { width: 23px; height: 23px; }
      .tabbar a.on { color: var(--acc); font-weight: 700; }
      .tabbar a.on svg.i { stroke-width: 2.4; }

      .wrap { padding-top: 12px; padding-bottom: calc(80px + env(safe-area-inset-bottom)); }
      .panel { padding: 14px 12px 16px; margin-top: 12px; }
      h1 { font-size: 20px; }
      .sec-head { margin-bottom: 12px; }
      .sec-head h2 { font-size: 17px; }
      .foot { padding-top: 24px; }

      .hero { height: 200px; border-radius: 16px; }
      .slide { padding: 16px 18px; gap: 16px; }
      .slide .cv { width: 112px; border-radius: 10px; }
      .slide h3 { font-size: 20px; margin: 8px 0 4px; }
      .slide .from { font-size: 12px; }
      .slide .go { margin-top: 12px; padding: 6px 16px; font-size: 13px; }
      .hero .dots { right: 14px; bottom: 12px; }

      .quick { gap: 8px; margin-top: 12px; }
      .quick a { flex-direction: column; gap: 6px; padding: 12px 4px 10px; text-align: center; }
      .quick .ic { width: 40px; height: 40px; }
      .quick b { font-size: 13px; }
      .quick small { display: none; }

      .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px 9px; }
      .grid.row { grid-template-columns: none; grid-auto-columns: 30%; }
      .cover { border-radius: 10px; }
      .card .t { font-size: 13px; margin-top: 6px; }
      .cover .badge { font-size: 10px; padding: 18px 5px 4px; }
      .rank { grid-template-columns: 1fr; grid-template-rows: none; grid-auto-flow: row; }
      .rank a { grid-template-columns: 30px 48px 1fr; gap: 10px; padding: 7px 2px; }
      .rank .c { width: 48px; }
      .seg { width: 100%; }
      .seg a { flex: 1; text-align: center; padding: 6px 4px; font-size: 13px; }

      .m-hero { gap: 14px; padding: 16px; border-radius: 16px; flex-wrap: wrap; }
      .m-hero .cover { width: 112px; }
      .m-hero .body { flex-basis: calc(100% - 126px); }
      .m-hero h1 { font-size: 20px; }
      .m-hero .desc { font-size: 13px; }
      .m-hero .bar { flex-basis: 100%; display: grid; grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); gap: 8px; padding-top: 4px; }
      .m-hero .bar .btn { padding: 10px 8px; font-size: 14px; }
      .ch-tools input { max-width: none; flex-basis: 100%; }
      .chs { grid-template-columns: 1fr 1fr; gap: 8px; }
      .ch a { padding: 10px; min-height: 50px; }
      .ch .dl { min-width: 42px; padding: 0 12px; }

      .r-top #rw, .r-top .hint { display: none; }
      .r-top .btn span { display: none; }
      .reader { max-width: 100% !important; }
      .r-end { max-width: none; padding: 0 max(12px, env(safe-area-inset-right)) calc(96px + env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); }
      .r-end .hint { display: none; }
      .float-nav { bottom: calc(10px + env(safe-area-inset-bottom)); }
      .float-nav > .btn { min-height: 42px; padding: 8px 14px; }
      .to-top { right: max(12px, env(safe-area-inset-right)); bottom: calc(70px + env(safe-area-inset-bottom)); }
      .toast { top: calc(64px + env(safe-area-inset-top)); }
    }
    @media (max-width: 360px) {
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .grid.row { grid-auto-columns: 42%; }
      .chs { grid-template-columns: 1fr; }
    }
    @media (hover: none) {
      .card:hover .cover img { transform: none; }
      .quick a:hover { transform: none; }
      .btn:hover { filter: none; }
    }
  </style>
</head>
<body>
  <div class="progress" id="progress"></div>
  <header class="top">
    <div class="top-inner">
      <a class="brand" href="#/"><span class="logo">坤</span><span>i kun<b>漫画</b></span></a>
      <nav id="nav">
        <a href="#/" data-nav="home">首页</a>
        <a href="#/list/hots" data-nav="hots">排行榜</a>
        <a href="#/list/dayup" data-nav="dayup">热门更新</a>
        <a href="#/list/newss" data-nav="newss">新作上架</a>
        <a href="#/history" data-nav="history">我的书架</a>
      </nav>
      <form class="search" id="form" role="search">
        <input id="q" type="search" placeholder="搜索漫画名" autocomplete="off" enterkeyhint="search" inputmode="search" />
        <button class="btn" type="submit">搜索</button>
      </form>
    </div>
  </header>
  <main class="wrap" id="view"></main>
  <footer class="foot">i kun漫画 · 包子 / 嬉皮 / Kmoe</footer>
  <nav class="tabbar" id="tabbar"></nav>
  <button class="to-top" id="toTop" title="回到顶部">↑</button>
  <div class="toast" id="toast"></div>

  <script>
    const $ = (s, el = document) => el.querySelector(s);
    const $$ = (s, el = document) => [...el.querySelectorAll(s)];
    const view = $("#view");
    const qEl = $("#q");

    const SITE = "i kun漫画";
    const LISTS = { hots: "人气排行", dayup: "热门更新", newss: "最新上架" };
    const isPhone = () => matchMedia("(max-width: 680px)").matches;
    const cfUrl = (u) => String(u || "")
      .replace("://hip-tx-1.s3imgs.top", "://hip-cf-1.s3imgs.top")
      .replace("://hip-tx-s1.s3imgs.top", "://hip-cf-s1.s3imgs.top");
    const pageSrc = (p) => cfUrl(p.cf || p.url || "");
    const preloadImgs = [];
    function preloadImage(url) {
      if (!url || preloadImgs.includes(url)) return;
      preloadImgs.push(url);
      const l = document.createElement("link");
      l.rel = "preload"; l.as = "image"; l.href = url; l.referrerPolicy = "no-referrer";
      document.head.appendChild(l);
    }

    const svg = (d) => '<svg class="i" viewBox="0 0 24 24" aria-hidden="true">' + d + "</svg>";
    const ICON = {
      home: svg('<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>'),
      fire: svg('<path d="M12 22c4 0 7-2.7 7-6.8 0-3.4-2.2-5.6-3.6-7.2-.3 1.8-1.2 3-2.4 3.4.4-3.3-1-6.6-4-8.4.2 3-1.4 4.8-2.8 6.5C4.9 11.1 5 12.6 5 15.2 5 19.3 8 22 12 22z"/>'),
      bolt: svg('<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>'),
      clock: svg('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'),
      star: svg('<path d="m12 3 2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.6l-5.4 2.9 1.2-6-4.5-4.2 6.1-.7z"/>'),
      book: svg('<path d="M4 19.5V5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5 2.5 2.5 0 0 0 6.5 23H20v-5"/>'),
      back: svg('<path d="m15 18-6-6 6-6"/>'),
      dl: svg('<path d="M12 4v11m0 0-4-4m4 4 4-4M5 20h14"/>'),
    };
    $("#tabbar").innerHTML = [
      ["#/", "home", "首页", "home"], ["#/list/hots", "hots", "排行", "fire"], ["#/list/dayup", "dayup", "更新", "clock"],
      ["#/list/newss", "newss", "新作", "star"], ["#/history", "history", "书架", "book"],
    ].map(([h, id, t, ic]) => '<a href="' + h + '" data-nav="' + id + '">' + ICON[ic] + "<span>" + t + "</span></a>").join("");

    function esc(s) {
      return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }
    const enc = encodeURIComponent;

    /* ---------- storage (书架 / 阅读记录) ---------- */
    const store = {
      get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
      set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
    };
    function readHistory() { return store.get("bz.history", {}); }
    function recordRead(m) {
      const h = readHistory();
      const prev = h[m.slug] || {};
      const read = new Set(prev.read || []);
      read.add(m.cid);
      h[m.slug] = { ...prev, ...m, read: [...read].slice(-3000), ts: Date.now() };
      const keys = Object.keys(h).sort((a, b) => h[b].ts - h[a].ts);
      keys.slice(200).forEach((k) => delete h[k]);
      store.set("bz.history", h);
    }
    function rememberManga(j) {
      const h = readHistory();
      if (!h[j.slug]) return;
      h[j.slug] = { ...h[j.slug], title: j.title, cover: j.cover || h[j.slug].cover, total: (j.chapters || []).length };
      store.set("bz.history", h);
    }
    function recentList() {
      const h = readHistory();
      return Object.values(h).sort((a, b) => b.ts - a.ts);
    }

    /* ---------- fetch ---------- */
    const memo = new Map();
    async function api(url, { cache = true } = {}) {
      if (cache && memo.has(url)) return memo.get(url);
      const sk = "ikun:" + url;
      if (cache) {
        try {
          const raw = sessionStorage.getItem(sk);
          if (raw) {
            const obj = JSON.parse(raw);
            if (Date.now() - obj.t < 15 * 60 * 1000 && obj.j && Number(obj.j.code) === 0) {
              memo.set(url, Promise.resolve(obj.j));
              return obj.j;
            }
          }
        } catch {}
      }
      const p = (async () => {
        let r;
        try { r = await fetch(url); } catch { throw new Error("网络连接失败，本地服务是否在运行？"); }
        let j;
        try { j = await r.json(); } catch { throw new Error("服务返回异常（HTTP " + r.status + "）"); }
        if (Number(j.code) !== 0) throw new Error(j.msg || "上游请求失败");
        if (cache) {
          try { sessionStorage.setItem(sk, JSON.stringify({ t: Date.now(), j })); } catch {}
        }
        return j;
      })();
      if (cache) {
        memo.set(url, p);
        p.catch(() => memo.delete(url));
        if (memo.size > 60) memo.delete(memo.keys().next().value);
      }
      return p;
    }
    const isHip = (x) => {
      const s = String((x && x.source) || x || "");
      return s === "hip" || s.startsWith("hip-") || (typeof x === "object" && x && String(x.slug || "").startsWith("hip-"));
    };
    const isKmoe = (x) => {
      const s = String((x && x.source) || x || "");
      return s === "kmoe" || s.startsWith("kmoe-") || (typeof x === "object" && x && String(x.slug || "").startsWith("kmoe-"));
    };
    const chapterUrl = (mid, cid, src) => "/api/chapter?m=" + enc(mid) + "&c=" + enc(cid) + (src === "hip" || String(cid || "").indexOf("-") >= 0 ? "&src=hip" : "");
    const mangaUrl = (slug) => "/api/manga?slug=" + enc(slug);

    /* ---------- ui helpers ---------- */
    let toastTimer;
    function toast(msg, ms = 2600) {
      const t = $("#toast");
      t.textContent = msg;
      t.classList.add("on");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove("on"), ms);
    }
    function render(html) { view.innerHTML = html; }
    const panel = (html, cls) => '<section class="panel' + (cls ? " " + cls : "") + '">' + html + "</section>";
    function skeletonGrid(n = 12, title) {
      return (title ? '<div class="sk sk-line" style="width:140px;height:24px;margin:0 0 18px"></div>' : "") +
        '<div class="grid">' + '<div class="sk sk-card"></div>'.repeat(n) + "</div>";
    }
    function errorBox(e) {
      return panel('<div class="state err">' + esc(e.message || e) +
        '<br><button class="btn ghost" data-retry>重试</button></div>');
    }
    function imgTag(src, cls) {
      return src ? '<img' + (cls ? ' class="' + cls + '"' : "") + ' src="' + esc(src) + '" loading="lazy" decoding="async" referrerpolicy="no-referrer" alt="" draggable="false" onload="this.classList.add(\'ok\')" onerror="this.remove()">' : "";
    }
    const srcName = (s) => isHip(s) ? "嬉皮漫画" : isKmoe(s) ? "Kmoe" : s && s.source === "bz" ? "包子漫画" : "";
    const srcTag = (s) => s.source === "hip" ? '<i class="src hip">嬉皮</i>' : s.source === "kmoe" ? '<i class="src kmoe">Kmoe</i>' : (s.source === "bz" ? '<i class="src bz">包子</i>' : "");
    function cover(src, extra) {
      return '<div class="cover">' + imgTag(src) + (extra || "") + "</div>";
    }
    const resumeHref = (r) => r.mid && r.cid ? "#/read/" + enc(r.slug) + "/" + enc(r.mid) + "/" + enc(r.cid) : "";
    // o: { cls, rank, badge(s), sub(s), href(s) }
    function cards(list, o = {}) {
      if (!list || !list.length) return '<div class="state">没有内容</div>';
      return '<div class="grid' + (o.cls ? " " + o.cls : "") + '">' + list.map((s, i) => {
        const badge = o.badge ? o.badge(s) : "";
        const href = (o.href && o.href(s)) || "#/manga/" + enc(s.slug);
        return '<a class="card" href="' + href + '" title="' + esc(s.title) + '">' +
          cover(s.cover, srcTag(s) +
            (o.rank ? '<i class="no n' + (i + 1) + '">' + (i + 1) + "</i>" : "") +
            (badge ? '<div class="badge">' + esc(badge) + "</div>" : "")) +
          '<div class="t">' + esc(s.title) + "</div>" +
          (o.sub ? '<div class="s">' + esc(o.sub(s)) + "</div>" : "") + "</a>";
      }).join("") + "</div>";
    }
    function rankList(list) {
      return '<div class="rank">' + list.map((s, i) =>
        '<a class="r' + (i + 1) + '" href="#/manga/' + enc(s.slug) + '" title="' + esc(s.title) + '">' +
          '<b class="n">' + (i + 1) + "</b>" +
          '<span class="c">' + imgTag(s.cover) + "</span>" +
          '<span class="tx"><span class="tt">' + esc(s.title) + '</span><span class="ss">' + (srcName(s) || "人气漫画") + "</span></span></a>"
      ).join("") + "</div>";
    }
    function hero(list) {
      if (!list.length) return "";
      return '<section class="hero" id="hero"><div class="track">' + list.map((s, i) =>
        '<a class="slide" href="#/manga/' + enc(s.slug) + '">' +
          (s.cover ? '<img class="bg" src="' + esc(s.cover) + '" decoding="async" referrerpolicy="no-referrer" alt="" draggable="false">' : "") +
          '<span class="cv">' + (s.cover ? '<img src="' + esc(s.cover) + '" decoding="async" referrerpolicy="no-referrer" alt="" draggable="false">' : "") + "</span>" +
          '<span class="info"><span class="tag">人气 TOP ' + (i + 1) + "</span><h3>" + esc(s.title) + "</h3>" +
          '<span class="from">' + (srcName(s) ? srcName(s) + " · " : "") + '本周人气榜</span><span class="go">立即阅读 ›</span></span></a>'
      ).join("") + '</div><div class="dots">' + list.map((_, i) => "<i" + (i ? "" : ' class="on"') + ' data-i="' + i + '"></i>').join("") + "</div></section>";
    }
    function startHero(ctx) {
      const box = $("#hero");
      if (!box) return;
      const track = $(".track", box), dots = $$(".dots i", box);
      const n = dots.length;
      let cur = 0, hold = 0, hover = false;
      const go = (i) => track.scrollTo({ left: i * track.clientWidth, behavior: "smooth" });
      track.addEventListener("scroll", () => {
        const k = Math.round(track.scrollLeft / Math.max(1, track.clientWidth));
        if (k !== cur) { cur = k; dots.forEach((d, j) => d.classList.toggle("on", j === cur)); }
      }, { passive: true });
      track.addEventListener("touchstart", () => { hold = Date.now(); }, { passive: true });
      track.addEventListener("pointerdown", () => { hold = Date.now(); });
      box.addEventListener("mouseenter", () => { hover = true; });
      box.addEventListener("mouseleave", () => { hover = false; });
      box.querySelector(".dots").onclick = (e) => { const d = e.target.closest("i"); if (d) { hold = Date.now(); go(Number(d.dataset.i)); } };
      if (n < 2 || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      const t = setInterval(() => {
        if (ctx.stale()) return clearInterval(t);
        if (hover || document.hidden || Date.now() - hold < 6000) return;
        go((cur + 1) % n);
      }, 4500);
      pageCleanup = () => clearInterval(t);
    }
    function quick() {
      return '<div class="quick">' + [
        ["#/list/hots", "q1", "fire", "人气榜", "大家都在看"],
        ["#/list/dayup", "q2", "bolt", "热门更新", "追更不迷路"],
        ["#/list/newss", "q3", "star", "新作上架", "抢先看新番"],
        ["#/history", "q4", "book", "我的书架", "接着上次看"],
      ].map(([h, c, ic, t, s]) => '<a href="' + h + '" class="' + c + '"><span class="ic">' + ICON[ic] + "</span><span><b>" + t + "</b><small>" + s + "</small></span></a>").join("") + "</div>";
    }
    function secHead(title, more, moreText) {
      return '<div class="sec-head"><h2>' + esc(title) + "</h2>" + (more ? '<a class="more" href="' + more + '">' + (moreText || "更多") + " ›</a>" : "") + "</div>";
    }
    function setNav(id) {
      $$("[data-nav]").forEach((a) => a.classList.toggle("on", a.dataset.nav === id));
    }
    function fmtDate(s) { return String(s || "").slice(0, 10); }
    function ago(ts) {
      const d = (Date.now() - ts) / 1000;
      if (d < 60) return "刚刚";
      if (d < 3600) return Math.floor(d / 60) + " 分钟前";
      if (d < 86400) return Math.floor(d / 3600) + " 小时前";
      return Math.floor(d / 86400) + " 天前";
    }

    /* ---------- pages ---------- */
    async function pageHome(ctx) {
      setNav("home");
      document.title = SITE + " · 热门漫画在线看";
      const recent = recentList().slice(0, 12);
      const shelf = recent.length
        ? panel(secHead("继续阅读", "#/history", "书架") + cards(recent, { cls: "row", badge: (r) => r.ctitle, href: resumeHref }))
        : "";
      render('<div class="hero sk"></div>' + quick() + shelf + panel(secHead("人气排行") + skeletonGrid(12)));
      const j = await api("/api/home");
      if (ctx.stale()) return;
      const s = j.sections || {};
      const rank = s.rank || [];
      const sec = (title, list, more) => list && list.length ? panel(secHead(title, more) + cards(list)) : "";
      render(
        hero(rank.slice(0, 5)) + quick() + shelf +
        (rank.length ? panel(secHead("人气排行榜", "#/list/hots", "完整榜单") + rankList(rank.slice(0, 10))) : "") +
        sec("近期更新", s.recent) +
        sec("热门更新", s.hot_update, "#/list/dayup") +
        sec("最新上架", s.new, "#/list/newss")
      );
      startHero(ctx);
    }

    async function pageList(ctx, kind) {
      const title = LISTS[kind] || kind;
      setNav(kind);
      document.title = title + " · " + SITE;
      const head = (sub) => '<div class="list-head"><h1>' + esc(title) + '</h1><div class="seg">' +
        Object.entries(LISTS).map(([k, v]) => '<a href="#/list/' + k + '"' + (k === kind ? ' class="on"' : "") + ">" + v + "</a>").join("") +
        '</div></div><div class="sub list-sub">' + sub + "</div>";
      render(panel(head("加载中…") + skeletonGrid(18)));
      const j = await api("/api/list?kind=" + enc(kind));
      if (ctx.stale()) return;
      render(panel(head("共 " + (j.list || []).length + " 部") + cards(j.list, { rank: kind === "hots" })));
    }

    async function pageHistory() {
      setNav("history");
      document.title = "书架 · " + SITE;
      const list = recentList();
      if (!list.length) {
        render(panel('<h1>我的书架</h1><div class="state">还没有阅读记录，去<a href="#/" style="color:var(--acc)">首页</a>挑一部吧</div>'));
        return;
      }
      render(panel(
        '<div class="list-head"><h1>我的书架</h1>' +
        '<button class="btn ghost sm" id="clearHist">清空记录</button></div>' +
        '<div class="sub list-sub">共 ' + list.length + " 部 · 阅读进度保存在本浏览器</div>" +
        cards(list, { badge: (r) => r.ctitle || "", sub: (r) => ago(r.ts) + "看过", href: resumeHref })
      ));
      $("#clearHist").onclick = () => {
        if (confirm("确定清空全部阅读记录？")) { store.set("bz.history", {}); route(); }
      };
    }

    async function pageSearch(ctx, kw, page) {
      setNav("");
      qEl.value = kw;
      document.title = kw + " · 搜索 · " + SITE;
      render(panel('<h1>「' + esc(kw) + '」</h1><div class="sub list-sub">正在搜索…</div>' + skeletonGrid(12)));
      const j = await api("/api/search?q=" + enc(kw) + "&page=" + page);
      if (ctx.stale()) return;
      const list = j.list || [];
      const per = 60;
      const hasMore = j.total ? page * per < j.total : list.length >= per;
      const base = "#/search/" + enc(kw) + "/";
      render(panel(
        '<h1>「' + esc(kw) + "」</h1>" +
        '<div class="sub list-sub">找到 ' + (j.total || list.length) + " 部相关漫画" + (page > 1 ? " · 第 " + page + " 页" : "") + "</div>" +
        (list.length ? cards(list) : '<div class="state">没有找到相关漫画，换个关键词试试</div>') +
        (page > 1 || hasMore ? '<div class="pager">' +
          (page > 1 ? '<a class="btn ghost" href="' + base + (page - 1) + '">上一页</a>' : "") +
          '<span class="meta">第 ' + page + " 页</span>" +
          (hasMore ? '<a class="btn ghost" href="' + base + (page + 1) + '">下一页</a>' : "") + "</div>" : "")
      ));
    }

    async function pageManga(ctx, slug) {
      setNav("");
      document.title = "加载中 · " + SITE;
      render(
        '<div class="m-hero" style="background:var(--card)"><div class="cover sk" style="box-shadow:none"></div><div class="body">' +
        '<div class="sk sk-line" style="width:50%;height:28px"></div><div class="sk sk-line" style="width:30%"></div>' +
        '<div class="sk sk-line"></div><div class="sk sk-line" style="width:80%"></div></div></div>'
      );
      const j = await api(mangaUrl(slug));
      if (ctx.stale()) return;
      rememberManga(j);
      document.title = j.title + " · " + SITE;
      const chs = j.chapters || [];
      const latest = chs[0], first = chs[chs.length - 1];
      const h = readHistory()[j.slug || slug] || {};
      const readSet = new Set(h.read || []);
      const kmoe = isKmoe(j) || isKmoe({ slug });
      const ext = j.external || (kmoe ? "https://kzo.moe/c/" + j.id + ".htm" : "");
      const readHref = (cid) => kmoe ? ext : "#/read/" + enc(j.slug || slug) + "/" + enc(j.id) + "/" + enc(cid);
      const desc = (j.desc || "").trim();
      const from = srcName(j) || srcName({ slug });

      render(
        '<div class="m-hero">' + (j.cover ? '<img class="bg" src="' + esc(j.cover) + '" referrerpolicy="no-referrer" alt="" draggable="false">' : "") +
          cover(j.cover) +
          '<div class="body">' +
            "<h1>" + esc(j.title) + "</h1>" +
            '<div class="chips">' +
              (latest ? '<span class="hot">更新至 ' + esc(latest.title) + "</span>" : "") +
              "<span>共 " + chs.length + " 话</span>" +
              (latest && latest.updated ? "<span>" + fmtDate(latest.updated) + "</span>" : "") +
              (from ? "<span>" + from + "</span>" : "") +
            "</div>" +
            (desc ? '<div class="desc" id="desc">' + esc(desc) + '</div><button class="more" id="descMore" hidden>展开简介 ▾</button>' : "") +
          "</div>" +
          '<div class="bar">' +
            (kmoe ? '<a class="btn" href="' + esc(ext) + '" target="_blank" rel="noopener">去 kzo.moe 登录下载</a>' : "") +
            (!kmoe && h.cid ? '<a class="btn" href="' + readHref(h.cid) + '">续看 · ' + esc(h.ctitle || "") + "</a>" : "") +
            (!kmoe && first ? '<a class="btn' + (h.cid ? " glass" : "") + '" href="' + readHref(first.id) + '">从第一话开始</a>' : "") +
            (!kmoe && latest ? '<a class="btn glass" href="' + readHref(latest.id) + '">看最新</a>' : "") +
          "</div>" +
        "</div>" +
        panel(
          secHead("章节目录") +
          '<div class="ch-tools">' +
            '<input id="chFilter" type="search" placeholder="筛选章节，如 100 或 番外" autocomplete="off">' +
            '<button class="btn ghost sm" id="chSort">最新在前</button>' +
            (h.cid ? '<button class="btn ghost sm" id="chLocate">定位到上次</button>' : "") +
            '<span class="meta" id="chCount"></span>' +
          "</div>" +
          '<div class="chs" id="chs"></div>'
        )
      );
      // 手机上按钮栏放到封面下方整行
      const mh = $(".m-hero", view);
      if (!isPhone()) $(".body", mh).appendChild($(".bar", mh));

      const d = $("#desc"), more = $("#descMore");
      if (d && d.scrollHeight > d.clientHeight + 4) {
        more.hidden = false;
        more.onclick = () => { const o = d.classList.toggle("open"); more.textContent = o ? "收起简介 ▴" : "展开简介 ▾"; };
      }

      let asc = false;
      const box = $("#chs");
      const draw = () => {
        const f = $("#chFilter").value.trim().toLowerCase();
        let list = f ? chs.filter((c) => c.title.toLowerCase().includes(f)) : chs;
        if (asc) list = list.slice().reverse();
        box.innerHTML = list.map((c) =>
          '<div class="ch' + (c.id === h.cid ? " last" : readSet.has(c.id) ? " read" : "") + '" data-id="' + esc(c.id) + '">' +
            '<a href="' + (kmoe ? esc(ext) : readHref(c.id)) + '"' + (kmoe ? ' target="_blank" rel="noopener"' : "") + ' title="' + esc(c.title) + '"><div class="name">' + esc(c.title) + "</div>" +
            '<div class="meta">' + fmtDate(c.updated) + (c.pages ? " · " + esc(c.pages) + " 页" : "") + "</div></a>" +
            (kmoe
              ? '<a class="dl" href="' + esc(ext) + '" target="_blank" rel="noopener" title="原站登录后下载">↗</a>'
              : '<button class="dl" data-dl="' + esc(c.id) + '" title="下载本话 zip" aria-label="下载">⤓</button>') + "</div>"
        ).join("") || '<div class="state" style="grid-column:1/-1">没有匹配的章节</div>';
        $("#chCount").textContent = (f ? list.length + " / " : "") + chs.length + " 话";
      };
      draw();
      let ft;
      $("#chFilter").oninput = () => { clearTimeout(ft); ft = setTimeout(draw, 120); };
      $("#chSort").onclick = (e) => { asc = !asc; e.target.textContent = asc ? "最早在前" : "最新在前"; draw(); };
      const loc = $("#chLocate");
      if (loc) loc.onclick = () => {
        $("#chFilter").value = ""; draw();
        const el = box.querySelector('.ch.last');
        if (el) el.scrollIntoView({ block: "center", behavior: "smooth" });
      };
      box.onclick = (e) => {
        const b = e.target.closest("[data-dl]");
        if (b) downloadChapter(j.id, b.dataset.dl, b, j.source);
      };
    }

    let pageCleanup = null;
    async function pageRead(ctx, slug, mid, cid) {
      setNav("");
      document.body.classList.add("reading");
      document.documentElement.classList.add("reading-root");
      render(
        '<div class="r-top"><div class="in"><a class="back" href="#/manga/' + enc(slug) + '" aria-label="返回目录">' + ICON.back + "</a>" +
        '<div class="tt"><b>加载中…</b></div></div></div><div class="r-spacer"></div><div class="reader"><div class="pg">解开图链…</div></div>'
      );
      const j = await api(chapterUrl(mid, cid, String(slug || "").startsWith("hip-") ? "hip" : ""));
      if (ctx.stale()) return;
      slug = j.slug || slug;
      const pages = j.pages || [];
      const href = (c) => "#/read/" + enc(slug) + "/" + enc(mid) + "/" + enc(c);
      document.title = j.title + " · " + j.manga;
      recordRead({ slug, mid, cid, ctitle: j.title, title: j.manga, cover: (readHistory()[slug] || {}).cover });

      const width = isPhone() ? 99999 : store.get("bz.rw", 860);
      const imgs = pages.map((p, i) => {
        const proxy = "/img?line=" + enc(j.line) + "&path=" + enc(p.path) + (j.source === "hip" || (p.path || "").indexOf("/i/") === 0 ? "&src=hip" : "");
        const direct = pageSrc(p) || p.url || "";
        const eager = i < 4;
        return '<div class="pg" data-i="' + i + '"><span>' + (i + 1) + '</span>' +
          '<img ' + (eager ? 'fetchpriority="high" src="' + esc(direct || proxy) + '" ' : 'data-src="' + esc(direct || proxy) + '" ') +
          'decoding="async" referrerpolicy="no-referrer" draggable="false"' +
          ' data-proxy="' + esc(proxy) + '" data-direct="' + esc(direct) +
          '" alt="第 ' + (i + 1) + ' 页"></div>';
      }).join("");
      pages.slice(0, 4).forEach((p) => preloadImage(pageSrc(p) || p.url));
      const navBtn = (c, text, cls) => '<a class="btn sm' + (cls ? " " + cls : "") + '" ' +
        (c ? 'href="' + href(c) + '"' : 'aria-disabled="true" style="opacity:.4;pointer-events:none"') + ">" + text + "</a>";

      render(
        '<div class="r-top"><div class="in">' +
          '<a class="back" href="#/manga/' + enc(slug) + '" aria-label="返回目录" title="返回目录">' + ICON.back + "</a>" +
          '<div class="tt"><b>' + esc(j.manga) + "</b><span>" + esc(j.title) + " · " + pages.length + " 页</span></div>" +
          '<span class="hint"><span class="kbd">←</span> <span class="kbd">→</span> 切换章节</span>' +
          '<select id="rw" aria-label="阅读宽度">' +
            [[640, "窄"], [860, "标准"], [1120, "宽"], [99999, "铺满"]].map(([v, t]) =>
              '<option value="' + v + '"' + (v === width ? " selected" : "") + ">宽度：" + t + "</option>").join("") +
          "</select>" +
          '<button class="btn ghost sm" id="dl" title="下载本话">' + ICON.dl + "<span>下载</span></button>" +
        "</div></div>" +
        '<div class="r-spacer"></div>' +
        '<div class="reader" id="reader" style="--rw:' + width + 'px">' + (imgs || '<div class="state">这一话没有图片</div>') + "</div>" +
        '<div class="r-end">' +
          (j.next ? '<a class="btn" href="' + href(j.next) + '">下一话 · ' + esc(j.nexttitle) + "</a>" : '<div class="state">已经是最新一话了</div>') +
          '<div class="bar">' +
            (j.pre ? '<a class="btn ghost" href="' + href(j.pre) + '">上一话</a>' : "") +
            '<a class="btn ghost" href="#/manga/' + enc(slug) + '">返回目录</a></div>' +
          '<div class="hint">点击画面中间可显示 / 隐藏工具栏</div>' +
        "</div>" +
        '<div class="float-nav">' +
          navBtn(j.pre, "上一话", "ghost") +
          '<div class="mid"><select id="jump" aria-label="跳转章节"><option>' + esc(j.title) + "</option></select>" +
          '<span class="cnt" id="cnt">1 / ' + pages.length + "</span></div>" +
          navBtn(j.next, "下一话") +
        "</div>"
      );

      const reader = $("#reader");
      // 图片加载后高度会变化：用第一张图的宽高比给其余占位，且视口上方的图变高时补偿滚动，避免画面跳动
      let arSet = false;
      const settle = (img) => {
        const pg = img.parentNode;
        if (!pg || pg.classList.contains("ok")) return;
        const r = pg.getBoundingClientRect();
        const above = r.bottom <= 0;
        pg.classList.add("ok");
        if (!arSet && img.naturalWidth && img.naturalHeight) {
          arSet = true;
          reader.style.setProperty("--ar", (img.naturalWidth / img.naturalHeight).toFixed(4));
        }
        if (above) {
          const dh = pg.getBoundingClientRect().height - r.height;
          if (Math.abs(dh) > 1) scrollBy(0, dh);
        }
      };
      reader.addEventListener("load", (e) => {
        if (e.target.tagName === "IMG") settle(e.target);
      }, true);
      reader.addEventListener("error", (e) => {
        const img = e.target;
        if (img.tagName !== "IMG") return;
        const pg = img.parentNode;
        const tries = Number(img.dataset.tries || 0);
        const proxy = img.dataset.proxy || "";
        const onProxy = proxy && img.src.indexOf("/img?") >= 0;
        if (!onProxy && proxy) {
          img.dataset.tries = tries + 1;
          img.src = proxy;
          return;
        }
        if (tries < 2) {
          img.dataset.tries = tries + 1;
          const base = (onProxy ? proxy : (img.dataset.direct || img.src)).replace(/[?&]r=\d+$/, "");
          setTimeout(() => { img.src = base + (base.indexOf("?") >= 0 ? "&" : "?") + "r=" + Date.now(); }, 400 * (tries + 1));
          return;
        }
        pg.classList.add("fail");
        pg.querySelector("span").textContent = "第 " + (Number(pg.dataset.i) + 1) + " 页加载失败";
        if (!pg.querySelector("button")) {
          const b = document.createElement("button");
          b.className = "btn ghost sm"; b.textContent = "重新加载";
          b.onclick = () => {
            pg.classList.remove("fail");
            img.dataset.tries = 0;
            img.src = img.dataset.direct || proxy;
            b.remove();
          };
          pg.appendChild(b);
        }
      }, true);
      const io = new IntersectionObserver((ents) => {
        ents.forEach((en) => {
          if (!en.isIntersecting) return;
          const img = en.target;
          if (img.dataset.src && !img.getAttribute("src")) img.src = img.dataset.src;
          io.unobserve(img);
        });
      }, { rootMargin: "2800px 0px 2800px 0px" });
      $$("img", reader).forEach((img) => {
        if (img.complete && img.naturalWidth) settle(img);
        if (img.dataset.src) io.observe(img);
      });

      $("#rw").onchange = (e) => { const v = Number(e.target.value); store.set("bz.rw", v); reader.style.setProperty("--rw", v + "px"); };
      $("#dl").onclick = (e) => downloadChapter(mid, cid, e.currentTarget, j.source);

      // 章节下拉：目录接口有缓存，后台拉
      api(mangaUrl(slug)).then((m) => {
        if (ctx.stale()) return;
        const sel = $("#jump");
        sel.innerHTML = (m.chapters || []).map((c) =>
          '<option value="' + esc(c.id) + '"' + (c.id === String(cid) ? " selected" : "") + ">" + esc(c.title) + "</option>").join("");
        sel.onchange = () => { location.hash = href(sel.value); };
        rememberManga(m);
        recordRead({ slug, mid, cid, ctitle: j.title, title: m.title, cover: m.cover });
      }).catch(() => {});

      // 预取下一话图链 + 前几页图
      if (j.next) {
        api(chapterUrl(mid, j.next, j.source)).then((n) => {
          (n.pages || []).slice(0, 4).forEach((p) => preloadImage(pageSrc(p) || p.url));
        }).catch(() => {});
      }

      // 阅读进度 / 页码 / 工具栏自动隐藏
      const cnt = $("#cnt"), bar = $("#progress");
      const pgs = $$(".pg", reader);
      let lastY = scrollY, raf = 0;
      const onScroll = () => {
        if (raf) return;
        raf = requestAnimationFrame(() => {
          raf = 0;
          const max = document.documentElement.scrollHeight - innerHeight;
          bar.style.width = (max > 0 ? Math.min(100, scrollY / max * 100) : 0) + "%";
          const mid = innerHeight / 2;
          let cur = 0;
          for (let i = 0; i < pgs.length; i++) {
            if (pgs[i].getBoundingClientRect().top < mid) cur = i; else break;
          }
          if (cnt) cnt.textContent = (cur + 1) + " / " + pgs.length;
          const y = scrollY;
          if (y > 120 && y > lastY + 6) document.body.classList.add("hide-top");
          else if (y < lastY - 6 || y < 120) document.body.classList.remove("hide-top");
          lastY = y;
        });
      };
      const onKey = (e) => {
        if (e.target.matches("input, select, textarea") || e.metaKey || e.ctrlKey || e.altKey) return;
        if (e.key === "ArrowRight" && j.next) location.hash = href(j.next);
        else if (e.key === "ArrowLeft" && j.pre) location.hash = href(j.pre);
      };
      const onTap = (e) => {
        // 点阅读区中间切换工具栏显示
        if (!e.target.closest(".pg")) return;
        const x = e.clientX / innerWidth;
        if (x > .3 && x < .7) document.body.classList.toggle("hide-top");
      };
      addEventListener("scroll", onScroll, { passive: true });
      addEventListener("keydown", onKey);
      reader.addEventListener("click", onTap);
      onScroll();
      pageCleanup = () => {
        removeEventListener("scroll", onScroll);
        removeEventListener("keydown", onKey);
        io.disconnect();
        bar.style.width = "0";
        document.querySelectorAll('link[rel="preload"][as="image"]').forEach((n) => n.remove());
        preloadImgs.length = 0;
      };
    }

    function downloadChapter(mid, cid, btn, src) {
      const a = document.createElement("a");
      a.href = "/download?m=" + enc(mid) + "&c=" + enc(cid) + (src === "hip" || String(cid || "").indexOf("-") >= 0 ? "&src=hip" : "");
      document.body.appendChild(a);
      a.click();
      a.remove();
      toast("正在服务端打包 zip，整话图片较多时需要几十秒，请稍候…", 5000);
      if (btn) { btn.disabled = true; setTimeout(() => (btn.disabled = false), 8000); }
    }

    /* ---------- router ---------- */
    let seq = 0;
    const scrollMemo = {};
    let curHash = "";
    let restoreScroll = true;

    async function route() {
      const my = ++seq;
      const ctx = { stale: () => my !== seq };
      if (pageCleanup) { pageCleanup(); pageCleanup = null; }
      document.body.classList.remove("reading", "hide-top");
      document.documentElement.classList.remove("reading-root");

      const hash = location.hash || "#/";
      const want = restoreScroll ? scrollMemo[hash] || 0 : 0;
      restoreScroll = true;
      curHash = hash;
      const parts = hash.replace(/^#\/?/, "").split("/").map((p) => { try { return decodeURIComponent(p); } catch { return p; } });
      const [p0, p1, p2, p3] = parts;
      scrollTo(0, 0);

      try {
        if (!p0) await pageHome(ctx);
        else if (p0 === "list") await pageList(ctx, p1);
        else if (p0 === "history") await pageHistory(ctx);
        else if (p0 === "search" && p1) await pageSearch(ctx, p1, Math.max(1, parseInt(p2) || 1));
        else if (p0 === "manga" && p1) await pageManga(ctx, p1);
        else if (p0 === "read" && p3) await pageRead(ctx, p1, p2, p3);
        else { location.replace("#/"); return; }
        if (!ctx.stale() && want && p0 !== "read") scrollTo(0, want);
      } catch (e) {
        if (ctx.stale()) return;
        // 阅读页出错时恢复站点顶栏，否则没有返回入口
        document.body.classList.remove("reading", "hide-top");
        document.documentElement.classList.remove("reading-root");
        render(errorBox(e));
        $("[data-retry]", view).onclick = () => { memo.clear(); route(); };
      }
    }

    addEventListener("hashchange", route);
    addEventListener("scroll", () => { if (!document.body.classList.contains("reading")) scrollMemo[curHash] = scrollY; $("#toTop").classList.toggle("on", scrollY > 600); }, { passive: true });
    // 页内点击跳转从顶部开始，前进/后退恢复位置
    document.addEventListener("click", (e) => {
      const a = e.target.closest('a[href^="#"]');
      if (a && !e.metaKey && !e.ctrlKey && !e.shiftKey) restoreScroll = false;
    }, true);
    $("#toTop").onclick = () => scrollTo({ top: 0, behavior: "smooth" });

    $("#form").addEventListener("submit", (e) => {
      e.preventDefault();
      const kw = qEl.value.trim();
      if (!kw) return qEl.focus();
      restoreScroll = false;
      const h = "#/search/" + enc(kw) + "/1";
      if (location.hash === h) route(); else location.hash = h;
      qEl.blur();
    });
    addEventListener("keydown", (e) => {
      if (e.key === "/" && !e.target.matches("input, select, textarea")) { e.preventDefault(); qEl.focus(); qEl.select(); }
      if (e.key === "Escape" && e.target === qEl) qEl.blur();
    });
    try { window.history.scrollRestoration = "manual"; } catch {}

    route();
  </script>
</body>
</html>
