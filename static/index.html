<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0e14" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="i kun漫画" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="format-detection" content="telephone=no" />
  <title>i kun漫画</title>
  <style>
    :root {
      color-scheme: dark;
      --bg:#0b0e14; --card:#151a24; --card2:#1a2030; --line:#243044; --txt:#e8edf5; --muted:#8b98ab;
      --acc:#6d8bff; --acc2:#8fa6ff; --err:#ff8b8b; --ok:#7ad9a3; --radius:12px;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: auto; }
    body { margin: 0; font: 15px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif; background: var(--bg); color: var(--txt); -webkit-tap-highlight-color: transparent; }
    a { color: inherit; text-decoration: none; }
    button, input, select { font: inherit; }
    :focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }

    /* header */
    header.top { position: sticky; top: 0; z-index: 30; background: rgba(11,14,20,.9); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); transition: transform .25s ease; }
    body.reading.hide-top header.top { transform: translateY(-100%); }
    .top-inner, .wrap { max-width: 1120px; margin: 0 auto; padding: 0 max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left)); }
    .top-inner { display: flex; gap: 14px; align-items: center; height: 58px; }
    header.top { padding-top: env(safe-area-inset-top); }
    .brand { font-weight: 800; font-size: 18px; letter-spacing: .02em; flex-shrink: 0; white-space: nowrap; }
    .brand span { color: var(--acc); }
    nav { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
    nav::-webkit-scrollbar { display: none; }
    nav a { color: var(--muted); padding: 6px 10px; border-radius: 8px; white-space: nowrap; }
    nav a.on, nav a:hover { color: var(--txt); background: #1c2433; }
    form.search { display: flex; gap: 8px; flex: 1; max-width: 400px; margin-left: auto; }
    input, select { background: #121826; border: 1px solid var(--line); color: inherit; border-radius: 10px; padding: 8px 12px; min-width: 0; }
    input { flex: 1; }
    input:focus, select:focus { border-color: var(--acc); outline: none; }

    .btn { display: inline-flex; align-items: center; gap: 6px; background: var(--acc); color: #fff; border: 0; border-radius: 10px; padding: 8px 14px; cursor: pointer; white-space: nowrap; transition: filter .15s, background .15s; }
    .btn:hover { filter: brightness(1.12); }
    .btn:disabled { opacity: .45; cursor: default; filter: none; }
    .btn.ghost { background: var(--card2); border: 1px solid var(--line); color: #d7deea; }
    .btn.sm { padding: 5px 10px; font-size: 13px; border-radius: 8px; }

    /* layout */
    .wrap { padding-top: 18px; padding-bottom: 96px; }
    h1 { margin: 0 0 6px; font-size: 22px; line-height: 1.3; }
    .sec-head { display: flex; align-items: baseline; justify-content: space-between; margin: 26px 0 12px; }
    .sec-head h2 { margin: 0; font-size: 17px; color: #d4ddec; }
    .sec-head a { color: var(--muted); font-size: 13px; }
    .sec-head a:hover { color: var(--acc2); }
    .sub, .hint, .meta { color: var(--muted); font-size: 13px; }

    /* cards */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(136px, 1fr)); gap: 14px; }
    .card { display: block; background: var(--card); border-radius: var(--radius); overflow: hidden; transition: transform .15s, box-shadow .15s; }
    .card:hover { transform: translateY(-3px); box-shadow: 0 10px 24px #0007; }
    .cover { position: relative; aspect-ratio: 3/4; background: linear-gradient(135deg, #1b2230, #121722); }
    .cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .3s; }
    .cover img.ok { opacity: 1; }
    .cover .badge { position: absolute; left: 6px; bottom: 6px; right: 6px; font-size: 11px; background: rgba(0,0,0,.65); padding: 2px 6px; border-radius: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card .t { padding: 8px 9px 10px; font-size: 13px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: calc(2.8em + 18px); }

    /* skeleton */
    .sk { background: linear-gradient(90deg, #151a24 25%, #1d2432 37%, #151a24 63%); background-size: 400% 100%; animation: sk 1.3s ease infinite; border-radius: var(--radius); }
    @keyframes sk { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }
    .sk-card { aspect-ratio: 3/4.6; }
    .sk-line { height: 14px; margin: 8px 0; }

    /* state */
    .state { padding: 48px 16px; text-align: center; color: var(--muted); }
    .state.err { color: var(--err); }
    .state .btn { margin-top: 14px; }

    /* manga */
    .manga-head { display: flex; gap: 20px; margin: 4px 0 20px; }
    .manga-head .cover { width: 150px; flex-shrink: 0; align-self: flex-start; border-radius: var(--radius); overflow: hidden; }
    .manga-head .desc { color: #b5c0d2; font-size: 14px; margin: 10px 0; max-height: 4.5em; overflow: hidden; position: relative; }
    .manga-head .desc.open { max-height: none; }
    .manga-head .more { color: var(--acc2); font-size: 13px; cursor: pointer; background: none; border: 0; padding: 0; }
    .manga-head .bar .btn { white-space: normal; text-align: left; }
    .bar { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; align-items: center; }
    .ch-tools { display: flex; gap: 8px; align-items: center; margin: 18px 0 12px; flex-wrap: wrap; }
    .ch-tools input { max-width: 260px; }
    .ch-tools .meta { margin-left: auto; }
    .chs { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; }
    .ch { display: flex; align-items: center; background: var(--card); border: 1px solid transparent; border-radius: 10px; overflow: hidden; }
    .ch:hover { border-color: var(--line); }
    .ch a { flex: 1; min-width: 0; padding: 9px 10px; }
    .ch .name { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ch .meta { font-size: 11px; }
    .ch.read .name { color: var(--muted); }
    .ch.last { border-color: var(--acc); }
    .ch.last .name { color: var(--acc2); }
    .ch .dl { background: none; border: 0; color: var(--muted); padding: 0 12px; align-self: stretch; cursor: pointer; font-size: 15px; }
    .ch .dl:hover { color: var(--txt); background: #1f2738; }

    /* reader */
    body.reading .wrap { padding-left: 0; padding-right: 0; max-width: none; padding-top: 0; }
    .r-head { max-width: 1120px; margin: 0 auto; padding: 14px 16px 6px; }
    .r-head h1 { font-size: 18px; }
    .r-head select { max-width: 220px; }
    .reader { margin: 0 auto; max-width: var(--rw, 860px); }
    .reader .pg { position: relative; min-height: 70vh; background: #10141c; display: flex; align-items: center; justify-content: center; color: #4a5568; font-size: 13px; }
    .reader .pg.ok { min-height: 0; background: none; }
    .reader .pg img { width: 100%; display: block; }
    .reader .pg:not(.ok) img { position: absolute; opacity: 0; }
    .reader .pg.fail { flex-direction: column; gap: 10px; color: var(--err); }
    .r-end { max-width: 860px; margin: 24px auto 0; padding: 0 16px; display: grid; gap: 10px; }
    .r-end .btn { justify-content: center; padding: 14px; font-size: 16px; }
    .progress { position: fixed; top: 0; left: 0; height: 2px; background: var(--acc); z-index: 40; width: 0; transition: width .1s linear; }
    .float-nav { position: fixed; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom)); transform: translateX(-50%); display: flex; gap: 6px; align-items: center; background: rgba(21,26,36,.92); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid var(--line); border-radius: 14px; padding: 6px; box-shadow: 0 10px 30px #000a; z-index: 25; transition: opacity .25s, transform .25s; }
    body.hide-top .float-nav { opacity: 0; pointer-events: none; transform: translate(-50%, 20px); }
    .float-nav .cnt { color: var(--muted); font-size: 12px; padding: 0 8px; min-width: 56px; text-align: center; font-variant-numeric: tabular-nums; }

    /* misc */
    .to-top { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom)); width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line); background: var(--card2); color: var(--txt); cursor: pointer; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 26; font-size: 18px; }
    .to-top.on { opacity: 1; pointer-events: auto; }
    body.reading .to-top { display: none; }
    .toast { position: fixed; left: 50%; top: 72px; transform: translate(-50%, -10px); background: #1f2738; border: 1px solid var(--line); padding: 10px 16px; border-radius: 10px; z-index: 50; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; font-size: 14px; max-width: calc(100vw - 32px); }
    .toast.on { opacity: 1; transform: translate(-50%, 0); }
    .pager { display: flex; justify-content: center; gap: 10px; align-items: center; margin-top: 24px; }
    .kbd { display: inline-block; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; font-size: 11px; }

    @media (max-width: 680px) {
      .top-inner { flex-wrap: wrap; height: auto; padding-top: 8px; padding-bottom: 10px; gap: 8px 10px; }
      .brand { font-size: 16px; }
      nav { flex: 1; min-width: 0; }
      nav a { padding: 8px 10px; font-size: 14px; }
      form.search { order: 3; max-width: none; flex-basis: 100%; margin-left: 0; }
      form.search input, form.search .btn, input, select { font-size: 16px; }
      .btn { min-height: 42px; padding: 10px 14px; }
      .btn.sm { min-height: 40px; padding: 8px 12px; }
      .wrap { padding-top: 12px; padding-bottom: calc(88px + env(safe-area-inset-bottom)); }
      h1 { font-size: 20px; }
      .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
      .card .t { font-size: 12px; padding: 6px 6px 8px; min-height: 2.6em; }
      .cover .badge { font-size: 10px; left: 4px; right: 4px; bottom: 4px; }
      .manga-head { gap: 12px; }
      .manga-head .cover { width: 108px; }
      .ch-tools { margin: 12px 0 8px; }
      .ch-tools input { max-width: none; flex-basis: 100%; }
      .chs { grid-template-columns: 1fr 1fr; gap: 6px; }
      .ch a { padding: 11px 10px; min-height: 48px; }
      .ch .dl { min-width: 44px; padding: 0 14px; }
      .r-head { padding: 10px max(12px, env(safe-area-inset-right)) 4px max(12px, env(safe-area-inset-left)); }
      .r-head h1 { font-size: 16px; }
      .r-head select { max-width: none; flex: 1; min-width: 0; }
      .r-head .kbd, .r-head .hint { display: none; }
      .reader { max-width: 100% !important; }
      .reader .pg { min-height: 40vh; }
      .r-end { max-width: none; padding: 0 max(12px, env(safe-area-inset-right)) calc(76px + env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); }
      .r-end .btn { padding: 14px; min-height: 48px; }
      .float-nav { width: calc(100% - 20px); max-width: 440px; justify-content: space-between; padding: 8px; }
      .float-nav .btn { flex: 1; justify-content: center; min-height: 42px; }
      .to-top { right: max(12px, env(safe-area-inset-right)); }
      #rw { display: none; }
    }
    @media (max-width: 380px) {
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .chs { grid-template-columns: 1fr; }
    }
    @media (hover: none) {
      .card:hover { transform: none; box-shadow: none; }
      .btn:hover { filter: none; }
    }
  </style>
</head>
<body>
  <div class="progress" id="progress"></div>
  <header class="top">
    <div class="top-inner">
      <a class="brand" href="#/">i kun<span>漫画</span></a>
      <nav id="nav">
        <a href="#/" data-nav="home">首页</a>
        <a href="#/list/hots" data-nav="hots">人气</a>
        <a href="#/list/dayup" data-nav="dayup">更新</a>
        <a href="#/list/newss" data-nav="newss">上架</a>
        <a href="#/history" data-nav="history">书架</a>
      </nav>
      <form class="search" id="form" role="search">
        <input id="q" type="search" placeholder="搜漫画" autocomplete="off" enterkeyhint="search" inputmode="search" />
        <button class="btn" type="submit">搜索</button>
      </form>
    </div>
  </header>
  <main class="wrap" id="view"></main>
  <button class="to-top" id="toTop" title="回到顶部">↑</button>
  <div class="toast" id="toast"></div>

  <script>
    const $ = (s, el = document) => el.querySelector(s);
    const $$ = (s, el = document) => [...el.querySelectorAll(s)];
    const view = $("#view");
    const qEl = $("#q");

    const SITE = "i kun漫画";
    const LISTS = { hots: "人气推荐", dayup: "热门更新", newss: "最新上架" };
    const isPhone = () => matchMedia("(max-width: 680px)").matches;

    function esc(s) {
      return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }
    const enc = encodeURIComponent;

    /* ---------- storage (书架 / 阅读记录) ---------- */
    const store = {
      get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
      set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
    };
    function readHistory() { return store.get("bz.history", {}); }
    function recordRead(m) {
      const h = readHistory();
      const prev = h[m.slug] || {};
      const read = new Set(prev.read || []);
      read.add(m.cid);
      h[m.slug] = { ...prev, ...m, read: [...read].slice(-3000), ts: Date.now() };
      const keys = Object.keys(h).sort((a, b) => h[b].ts - h[a].ts);
      keys.slice(200).forEach((k) => delete h[k]);
      store.set("bz.history", h);
    }
    function rememberManga(j) {
      const h = readHistory();
      if (!h[j.slug]) return;
      h[j.slug] = { ...h[j.slug], title: j.title, cover: j.cover || h[j.slug].cover, total: (j.chapters || []).length };
      store.set("bz.history", h);
    }
    function recentList() {
      const h = readHistory();
      return Object.values(h).sort((a, b) => b.ts - a.ts);
    }

    /* ---------- fetch ---------- */
    const memo = new Map();
    async function api(url, { cache = true } = {}) {
      if (cache && memo.has(url)) return memo.get(url);
      const p = (async () => {
        let r;
        try { r = await fetch(url); } catch { throw new Error("网络连接失败，本地服务是否在运行？"); }
        let j;
        try { j = await r.json(); } catch { throw new Error("服务返回异常（HTTP " + r.status + "）"); }
        if (Number(j.code) !== 0) throw new Error(j.msg || "上游请求失败");
        return j;
      })();
      if (cache) {
        memo.set(url, p);
        p.catch(() => memo.delete(url));
        if (memo.size > 60) memo.delete(memo.keys().next().value);
      }
      return p;
    }
    const isHip = (x) => {
      const s = String((x && x.source) || x || "");
      return s === "hip" || s.startsWith("hip-") || (typeof x === "object" && x && String(x.slug || "").startsWith("hip-"));
    };
    const chapterUrl = (mid, cid, src) => "/api/chapter?m=" + enc(mid) + "&c=" + enc(cid) + (src === "hip" || String(cid || "").indexOf("-") >= 0 ? "&src=hip" : "");
    const mangaUrl = (slug) => "/api/manga?slug=" + enc(slug);

    /* ---------- ui helpers ---------- */
    let toastTimer;
    function toast(msg, ms = 2600) {
      const t = $("#toast");
      t.textContent = msg;
      t.classList.add("on");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove("on"), ms);
    }
    function render(html) { view.innerHTML = html; }
    function skeletonGrid(n = 12, title) {
      return (title ? '<div class="sk sk-line" style="width:140px;height:22px;margin:4px 0 18px"></div>' : "") +
        '<div class="grid">' + '<div class="sk sk-card"></div>'.repeat(n) + "</div>";
    }
    function errorBox(e) {
      return '<div class="state err">' + esc(e.message || e) +
        '<br><button class="btn ghost" data-retry>重试</button></div>';
    }
    function cover(src, badge) {
      return '<div class="cover">' +
        (src ? '<img src="' + esc(src) + '" loading="lazy" decoding="async" alt="" onload="this.classList.add(\'ok\')" onerror="this.remove()">' : "") +
        (badge ? '<div class="badge">' + esc(badge) + "</div>" : "") + "</div>";
    }
    function cards(list, badgeOf) {
      if (!list || !list.length) return '<div class="state">没有内容</div>';
      return '<div class="grid">' + list.map((s) => {
        const tag = badgeOf ? badgeOf(s) : (s.source === "hip" ? "嬉皮" : (s.source === "bz" ? "包子" : ""));
        return '<a class="card" href="#/manga/' + enc(s.slug) + '" title="' + esc(s.title) + '">' +
          cover(s.cover, tag) +
          '<div class="t">' + esc(s.title) + "</div></a>";
      }).join("") + "</div>";
    }
    function secHead(title, more) {
      return '<div class="sec-head"><h2>' + esc(title) + "</h2>" + (more ? '<a href="' + more + '">更多 ›</a>' : "") + "</div>";
    }
    function setNav(id) {
      $$("#nav a").forEach((a) => a.classList.toggle("on", a.dataset.nav === id));
    }
    function fmtDate(s) { return String(s || "").slice(0, 10); }
    function ago(ts) {
      const d = (Date.now() - ts) / 1000;
      if (d < 60) return "刚刚";
      if (d < 3600) return Math.floor(d / 60) + " 分钟前";
      if (d < 86400) return Math.floor(d / 3600) + " 小时前";
      return Math.floor(d / 86400) + " 天前";
    }

    /* ---------- pages ---------- */
    async function pageHome(ctx) {
      setNav("home");
      document.title = SITE;
      const recent = recentList().slice(0, 6);
      const shelf = recent.length
        ? secHead("继续阅读", recent.length >= 6 ? "#/history" : "") + cards(recent, (r) => r.ctitle)
        : "";
      render(shelf + secHead("人气排行") + skeletonGrid(12));
      const j = await api("/api/home");
      if (ctx.stale()) return;
      const s = j.sections || {};
      const sec = (title, list, more) => list && list.length ? secHead(title, more) + cards(list) : "";
      render(
        shelf +
        sec("人气排行", s.rank, "#/list/hots") +
        sec("近期更新", s.recent) +
        sec("热门更新", s.hot_update, "#/list/dayup") +
        sec("最新上架", s.new, "#/list/newss")
      );
      // 继续阅读卡片点进去直接续读
      $$(".card", view).slice(0, recent.length).forEach((a, i) => {
        const r = recent[i];
        if (r && r.mid && r.cid) a.href = "#/read/" + enc(r.slug) + "/" + enc(r.mid) + "/" + enc(r.cid);
      });
    }

    async function pageList(ctx, kind) {
      const title = LISTS[kind] || kind;
      setNav(kind);
      document.title = title + " · " + SITE;
      render(skeletonGrid(18, true));
      const j = await api("/api/list?kind=" + enc(kind));
      if (ctx.stale()) return;
      render("<h1>" + esc(title) + "</h1>" + '<div class="sub">' + (j.list || []).length + " 部</div><div style=\"height:14px\"></div>" + cards(j.list));
    }

    async function pageHistory() {
      setNav("history");
      document.title = "书架 · " + SITE;
      const list = recentList();
      if (!list.length) {
        render('<h1>书架</h1><div class="state">还没有阅读记录，去<a href="#/" style="color:var(--acc2)">首页</a>挑一部吧</div>');
        return;
      }
      render(
        '<div class="bar" style="justify-content:space-between"><h1 style="margin:0">书架</h1>' +
        '<button class="btn ghost sm" id="clearHist">清空记录</button></div>' +
        '<div class="sub" style="margin-bottom:14px">阅读进度保存在本浏览器</div>' +
        cards(list, (r) => (r.ctitle || "") + " · " + ago(r.ts))
      );
      $$(".card", view).forEach((a, i) => {
        const r = list[i];
        if (r.mid && r.cid) a.href = "#/read/" + enc(r.slug) + "/" + enc(r.mid) + "/" + enc(r.cid);
      });
      $("#clearHist").onclick = () => {
        if (confirm("确定清空全部阅读记录？")) { store.set("bz.history", {}); route(); }
      };
    }

    async function pageSearch(ctx, kw, page) {
      setNav("");
      qEl.value = kw;
      document.title = kw + " · 搜索 · " + SITE;
      render('<div class="sub">正在搜索「' + esc(kw) + "」…</div><div style=\"height:14px\"></div>" + skeletonGrid(12));
      const j = await api("/api/search?q=" + enc(kw) + "&page=" + page);
      if (ctx.stale()) return;
      const list = j.list || [];
      const per = 60;
      const hasMore = j.total ? page * per < j.total : list.length >= per;
      const base = "#/search/" + enc(kw) + "/";
      render(
        '<h1>「' + esc(kw) + "」</h1>" +
        '<div class="sub">共 ' + (j.total || list.length) + " 条" + (page > 1 ? " · 第 " + page + " 页" : "") + '</div><div style="height:14px"></div>' +
        (list.length ? cards(list) : '<div class="state">没有找到相关漫画，换个关键词试试</div>') +
        (page > 1 || hasMore ? '<div class="pager">' +
          (page > 1 ? '<a class="btn ghost" href="' + base + (page - 1) + '">上一页</a>' : "") +
          '<span class="meta">第 ' + page + " 页</span>" +
          (hasMore ? '<a class="btn ghost" href="' + base + (page + 1) + '">下一页</a>' : "") + "</div>" : "")
      );
    }

    async function pageManga(ctx, slug) {
      setNav("");
      document.title = "加载中 · " + SITE;
      render(
        '<div class="manga-head"><div class="cover sk" style="width:150px"></div><div style="flex:1">' +
        '<div class="sk sk-line" style="width:50%;height:24px"></div><div class="sk sk-line" style="width:30%"></div>' +
        '<div class="sk sk-line"></div><div class="sk sk-line" style="width:80%"></div></div></div>'
      );
      const j = await api(mangaUrl(slug));
      if (ctx.stale()) return;
      rememberManga(j);
      document.title = j.title + " · " + SITE;
      const chs = j.chapters || [];
      const latest = chs[0], first = chs[chs.length - 1];
      const h = readHistory()[j.slug || slug] || {};
      const readSet = new Set(h.read || []);
      const readHref = (cid) => "#/read/" + enc(j.slug || slug) + "/" + enc(j.id) + "/" + enc(cid);
      const desc = (j.desc || "").trim();

      render(
        '<div class="manga-head">' + cover(j.cover) +
          '<div style="min-width:0">' +
            "<h1>" + esc(j.title) + "</h1>" +
            '<div class="meta">共 ' + chs.length + " 话" + (latest ? " · 更新至 " + esc(latest.title) + " · " + fmtDate(latest.updated) : "") + "</div>" +
            (desc ? '<div class="desc" id="desc">' + esc(desc) + '</div><button class="more" id="descMore" hidden>展开简介</button>' : "") +
            '<div class="bar">' +
              (h.cid ? '<a class="btn" href="' + readHref(h.cid) + '">继续阅读 · ' + esc(h.ctitle || "") + "</a>" : "") +
              (first ? '<a class="btn' + (h.cid ? " ghost" : "") + '" href="' + readHref(first.id) + '">从第一话开始</a>' : "") +
              (latest ? '<a class="btn ghost" href="' + readHref(latest.id) + '">看最新</a>' : "") +
            "</div>" +
          "</div></div>" +
        '<div class="ch-tools">' +
          '<input id="chFilter" type="search" placeholder="筛选章节，如 100 或 番外" autocomplete="off">' +
          '<button class="btn ghost sm" id="chSort">最新在前</button>' +
          (h.cid ? '<button class="btn ghost sm" id="chLocate">定位到上次</button>' : "") +
          '<span class="meta" id="chCount"></span>' +
        "</div>" +
        '<div class="chs" id="chs"></div>'
      );

      const d = $("#desc"), more = $("#descMore");
      if (d && d.scrollHeight > d.clientHeight + 4) {
        more.hidden = false;
        more.onclick = () => { const o = d.classList.toggle("open"); more.textContent = o ? "收起简介" : "展开简介"; };
      }

      let asc = false;
      const box = $("#chs");
      const draw = () => {
        const f = $("#chFilter").value.trim().toLowerCase();
        let list = f ? chs.filter((c) => c.title.toLowerCase().includes(f)) : chs;
        if (asc) list = list.slice().reverse();
        box.innerHTML = list.map((c) =>
          '<div class="ch' + (c.id === h.cid ? " last" : readSet.has(c.id) ? " read" : "") + '" data-id="' + esc(c.id) + '">' +
            '<a href="' + readHref(c.id) + '" title="' + esc(c.title) + '"><div class="name">' + esc(c.title) + "</div>" +
            '<div class="meta">' + fmtDate(c.updated) + "</div></a>" +
            '<button class="dl" data-dl="' + esc(c.id) + '" title="下载本话 zip" aria-label="下载">⤓</button></div>'
        ).join("") || '<div class="state" style="grid-column:1/-1">没有匹配的章节</div>';
        $("#chCount").textContent = (f ? list.length + " / " : "") + chs.length + " 话";
      };
      draw();
      let ft;
      $("#chFilter").oninput = () => { clearTimeout(ft); ft = setTimeout(draw, 120); };
      $("#chSort").onclick = (e) => { asc = !asc; e.target.textContent = asc ? "最早在前" : "最新在前"; draw(); };
      const loc = $("#chLocate");
      if (loc) loc.onclick = () => {
        $("#chFilter").value = ""; draw();
        const el = box.querySelector('.ch.last');
        if (el) el.scrollIntoView({ block: "center", behavior: "smooth" });
      };
      box.onclick = (e) => {
        const b = e.target.closest("[data-dl]");
        if (b) downloadChapter(j.id, b.dataset.dl, b, j.source);
      };
    }

    let readerCleanup = null;
    async function pageRead(ctx, slug, mid, cid) {
      setNav("");
      document.body.classList.add("reading");
      render('<div class="r-head"><div class="sk sk-line" style="width:40%;height:22px"></div></div><div class="reader"><div class="pg">解开图链…</div></div>');
      const j = await api(chapterUrl(mid, cid, String(slug || "").startsWith("hip-") ? "hip" : ""));
      if (ctx.stale()) return;
      slug = j.slug || slug;
      const pages = j.pages || [];
      const href = (c) => "#/read/" + enc(slug) + "/" + enc(mid) + "/" + enc(c);
      document.title = j.title + " · " + j.manga;
      recordRead({ slug, mid, cid, ctitle: j.title, title: j.manga, cover: (readHistory()[slug] || {}).cover });

      const width = isPhone() ? 99999 : store.get("bz.rw", 860);
      const imgs = pages.map((p, i) => {
        const src = "/img?line=" + enc(j.line) + "&path=" + enc(p.path) + (j.source === "hip" || (p.path || "").indexOf("/i/") === 0 ? "&src=hip" : "");
        return '<div class="pg" data-i="' + i + '"><span>' + (i + 1) + '</span>' +
          '<img ' + (i < 3 ? 'fetchpriority="high" ' : 'loading="lazy" ') + 'decoding="async" src="' + src + '" alt="第 ' + (i + 1) + ' 页"></div>';
      }).join("");

      render(
        '<div class="r-head">' +
          '<div class="bar" style="margin-top:0">' +
            '<a class="btn ghost sm" href="#/manga/' + enc(slug) + '">‹ 目录</a>' +
            '<select id="jump" aria-label="跳转章节"><option>' + esc(j.title) + "</option></select>" +
            '<select id="rw" aria-label="阅读宽度">' +
              [[640, "窄"], [860, "标准"], [1120, "宽"], [99999, "铺满"]].map(([v, t]) =>
                '<option value="' + v + '"' + (v === width ? " selected" : "") + ">宽度：" + t + "</option>").join("") +
            "</select>" +
            '<button class="btn ghost sm" id="dl">下载本话</button>' +
          "</div>" +
          "<h1>" + esc(j.manga) + ' <span class="meta" style="font-size:15px">' + esc(j.title) + "</span></h1>" +
          '<div class="hint">' + pages.length + ' 页 · <span class="kbd">←</span> <span class="kbd">→</span> 切换章节</div>' +
        "</div>" +
        '<div class="reader" id="reader" style="--rw:' + width + 'px">' + (imgs || '<div class="state">这一话没有图片</div>') + "</div>" +
        '<div class="r-end">' +
          (j.next ? '<a class="btn" href="' + href(j.next) + '">下一话 · ' + esc(j.nexttitle) + "</a>" : '<div class="state">已经是最新一话了</div>') +
          '<div class="bar" style="justify-content:center">' +
            (j.pre ? '<a class="btn ghost" href="' + href(j.pre) + '">上一话</a>' : "") +
            '<a class="btn ghost" href="#/manga/' + enc(slug) + '">返回目录</a></div>' +
        "</div>" +
        '<div class="float-nav">' +
          '<a class="btn ghost sm" ' + (j.pre ? 'href="' + href(j.pre) + '"' : 'aria-disabled="true" style="opacity:.4;pointer-events:none"') + ">上一话</a>" +
          '<span class="cnt" id="cnt">1 / ' + pages.length + "</span>" +
          '<a class="btn sm" ' + (j.next ? 'href="' + href(j.next) + '"' : 'aria-disabled="true" style="opacity:.4;pointer-events:none"') + ">下一话</a>" +
        "</div>"
      );

      const reader = $("#reader");
      reader.addEventListener("load", (e) => {
        if (e.target.tagName === "IMG") e.target.parentNode.classList.add("ok");
      }, true);
      reader.addEventListener("error", (e) => {
        const img = e.target;
        if (img.tagName !== "IMG") return;
        const pg = img.parentNode;
        const tries = Number(img.dataset.tries || 0);
        if (tries < 2) {
          img.dataset.tries = tries + 1;
          setTimeout(() => { img.src = img.src.replace(/&r=\d+$/, "") + "&r=" + Date.now(); }, 800 * (tries + 1));
          return;
        }
        pg.classList.add("fail");
        pg.querySelector("span").textContent = "第 " + (Number(pg.dataset.i) + 1) + " 页加载失败";
        if (!pg.querySelector("button")) {
          const b = document.createElement("button");
          b.className = "btn ghost sm"; b.textContent = "重新加载";
          b.onclick = () => { pg.classList.remove("fail"); img.dataset.tries = 0; img.src = img.src.replace(/&r=\d+$/, "") + "&r=" + Date.now(); b.remove(); };
          pg.appendChild(b);
        }
      }, true);
      // 已经从缓存命中的图片可能不触发 load
      $$("img", reader).forEach((img) => { if (img.complete && img.naturalWidth) img.parentNode.classList.add("ok"); });

      $("#rw").onchange = (e) => { const v = Number(e.target.value); store.set("bz.rw", v); reader.style.setProperty("--rw", v + "px"); };
      $("#dl").onclick = (e) => downloadChapter(mid, cid, e.target, j.source);

      // 章节下拉：目录接口有缓存，后台拉
      api(mangaUrl(slug)).then((m) => {
        if (ctx.stale()) return;
        const sel = $("#jump");
        sel.innerHTML = (m.chapters || []).map((c) =>
          '<option value="' + esc(c.id) + '"' + (c.id === String(cid) ? " selected" : "") + ">" + esc(c.title) + "</option>").join("");
        sel.onchange = () => { location.hash = href(sel.value); };
        rememberManga(m);
        recordRead({ slug, mid, cid, ctitle: j.title, title: m.title, cover: m.cover });
      }).catch(() => {});

      // 预取下一话图链 + 前几页图
      if (j.next) {
        api(chapterUrl(mid, j.next)).then((n) => {
          (n.pages || []).slice(0, 3).forEach((p) => { const im = new Image(); im.src = "/img?line=" + enc(n.line) + "&path=" + enc(p.path) + (n.source === "hip" ? "&src=hip" : ""); });
        }).catch(() => {});
      }

      // 阅读进度 / 页码 / 顶栏自动隐藏
      const cnt = $("#cnt"), bar = $("#progress");
      const pgs = $$(".pg", reader);
      let lastY = scrollY, raf = 0;
      const onScroll = () => {
        if (raf) return;
        raf = requestAnimationFrame(() => {
          raf = 0;
          const max = document.documentElement.scrollHeight - innerHeight;
          bar.style.width = (max > 0 ? Math.min(100, scrollY / max * 100) : 0) + "%";
          const mid = innerHeight / 2;
          let cur = 0;
          for (let i = 0; i < pgs.length; i++) {
            if (pgs[i].getBoundingClientRect().top < mid) cur = i; else break;
          }
          if (cnt) cnt.textContent = (cur + 1) + " / " + pgs.length;
          const y = scrollY;
          if (y > 120 && y > lastY + 6) document.body.classList.add("hide-top");
          else if (y < lastY - 6 || y < 120) document.body.classList.remove("hide-top");
          lastY = y;
        });
      };
      const onKey = (e) => {
        if (e.target.matches("input, select, textarea") || e.metaKey || e.ctrlKey || e.altKey) return;
        if (e.key === "ArrowRight" && j.next) location.hash = href(j.next);
        else if (e.key === "ArrowLeft" && j.pre) location.hash = href(j.pre);
      };
      const onTap = (e) => {
        // 点阅读区中间切换工具栏显示
        if (!e.target.closest(".pg")) return;
        const x = e.clientX / innerWidth;
        if (x > .3 && x < .7) document.body.classList.toggle("hide-top");
      };
      addEventListener("scroll", onScroll, { passive: true });
      addEventListener("keydown", onKey);
      reader.addEventListener("click", onTap);
      onScroll();
      readerCleanup = () => {
        removeEventListener("scroll", onScroll);
        removeEventListener("keydown", onKey);
        bar.style.width = "0";
      };
    }

    function downloadChapter(mid, cid, btn, src) {
      const a = document.createElement("a");
      a.href = "/download?m=" + enc(mid) + "&c=" + enc(cid) + (src === "hip" || String(cid || "").indexOf("-") >= 0 ? "&src=hip" : "");
      document.body.appendChild(a);
      a.click();
      a.remove();
      toast("正在服务端打包 zip，整话图片较多时需要几十秒，请稍候…", 5000);
      if (btn) { btn.disabled = true; setTimeout(() => (btn.disabled = false), 8000); }
    }

    /* ---------- router ---------- */
    let seq = 0;
    const scrollMemo = {};
    let curHash = "";
    let restoreScroll = true;

    async function route() {
      const my = ++seq;
      const ctx = { stale: () => my !== seq };
      if (readerCleanup) { readerCleanup(); readerCleanup = null; }
      document.body.classList.remove("reading", "hide-top");

      const hash = location.hash || "#/";
      const want = restoreScroll ? scrollMemo[hash] || 0 : 0;
      restoreScroll = true;
      curHash = hash;
      const parts = hash.replace(/^#\/?/, "").split("/").map((p) => { try { return decodeURIComponent(p); } catch { return p; } });
      const [p0, p1, p2, p3] = parts;
      scrollTo(0, 0);

      try {
        if (!p0) await pageHome(ctx);
        else if (p0 === "list") await pageList(ctx, p1);
        else if (p0 === "history") await pageHistory(ctx);
        else if (p0 === "search" && p1) await pageSearch(ctx, p1, Math.max(1, parseInt(p2) || 1));
        else if (p0 === "manga" && p1) await pageManga(ctx, p1);
        else if (p0 === "read" && p3) await pageRead(ctx, p1, p2, p3);
        else { location.replace("#/"); return; }
        if (!ctx.stale() && want && p0 !== "read") scrollTo(0, want);
      } catch (e) {
        if (ctx.stale()) return;
        render(errorBox(e));
        $("[data-retry]", view).onclick = () => { memo.clear(); route(); };
      }
    }

    addEventListener("hashchange", route);
    addEventListener("scroll", () => { if (!document.body.classList.contains("reading")) scrollMemo[curHash] = scrollY; $("#toTop").classList.toggle("on", scrollY > 600); }, { passive: true });
    // 页内点击跳转从顶部开始，前进/后退恢复位置
    document.addEventListener("click", (e) => {
      const a = e.target.closest('a[href^="#"]');
      if (a && !e.metaKey && !e.ctrlKey && !e.shiftKey) restoreScroll = false;
    }, true);
    $("#toTop").onclick = () => scrollTo({ top: 0, behavior: "smooth" });

    $("#form").addEventListener("submit", (e) => {
      e.preventDefault();
      const kw = qEl.value.trim();
      if (!kw) return qEl.focus();
      restoreScroll = false;
      const h = "#/search/" + enc(kw) + "/1";
      if (location.hash === h) route(); else location.hash = h;
      qEl.blur();
    });
    addEventListener("keydown", (e) => {
      if (e.key === "/" && !e.target.matches("input, select, textarea")) { e.preventDefault(); qEl.focus(); qEl.select(); }
      if (e.key === "Escape" && e.target === qEl) qEl.blur();
    });
    try { window.history.scrollRestoration = "manual"; } catch {}

    route();
  </script>
</body>
</html>
